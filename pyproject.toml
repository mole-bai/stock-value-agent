[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-value-agent"
version = "0.2.0"
description = "Personal, evidence-first value-investing monitor for a small watchlist"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stock-agent = "stock_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
