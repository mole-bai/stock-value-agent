name: Daily stock value monitor

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # GitHub cron is UTC. 10:30 UTC = 18:30 Asia/Shanghai.
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-stock-value-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    name: Monitor Tencent, Pop Mart, and Moutai
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      TZ: Asia/Shanghai

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore monitoring state
        uses: actions/cache@v4
        with:
          path: var
          key: stock-agent-state-${{ github.run_id }}
          restore-keys: |
            stock-agent-state-

      - name: Validate configuration and financial snapshots
        run: python3 -m stock_agent validate

      - name: Run deterministic test suite
        run: python3 -m unittest discover -s tests

      - name: Fetch live data and generate report
        run: python3 -m stock_agent live

      - name: Prepare dashboard data
        shell: bash
        run: |
          report_json="$(find reports -maxdepth 1 -type f -name 'daily-*.json' -print | sort | tail -n 1)"
          if [[ -z "$report_json" ]]; then
            echo "No JSON report was generated." >&2
            exit 1
          fi
          python3 -m stock_agent.dashboard "$report_json" site/data/latest.json

      - name: Add the report to the Actions summary
        if: always()
        shell: bash
        run: |
          report_path="$(find reports -maxdepth 1 -type f -name 'daily-*.md' -print | sort | tail -n 1)"
          if [[ -n "$report_path" ]]; then
            cat "$report_path" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No daily report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Archive report files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-report-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 90

      - name: Publish dashboard to public site repository
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          DASHBOARD_DEPLOY_KEY: ${{ secrets.DASHBOARD_DEPLOY_KEY }}
        run: |
          if [[ -z "$DASHBOARD_DEPLOY_KEY" ]]; then
            echo "DASHBOARD_DEPLOY_KEY is not configured." >&2
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DASHBOARD_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts"
          deploy_dir="$(mktemp -d)"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          git clone --depth 1 --branch gh-pages \
            git@github.com:mole-bai/stock-value-dashboard.git "$deploy_dir"
          rsync -a --delete --exclude='.git/' site/ "$deploy_dir/"
          git -C "$deploy_dir" config user.name "github-actions[bot]"
          git -C "$deploy_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$deploy_dir" add -A
          if git -C "$deploy_dir" diff --cached --quiet; then
            echo "Dashboard is already current."
            exit 0
          fi
          git -C "$deploy_dir" commit -m "Update dashboard from run ${GITHUB_RUN_NUMBER}"
          git -C "$deploy_dir" push origin gh-pages
